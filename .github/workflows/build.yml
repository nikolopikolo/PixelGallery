name: Build & Release PixelGallery

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APKs (Mobile & Wear)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload PixelGallery Mobile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelGallery-Mobile-debug
          path: mobile/build/outputs/apk/debug/*.apk

      - name: Upload PixelGallery Wear Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelGallery-Wear-debug
          path: wear/build/outputs/apk/debug/*.apk

      - name: Prepare Named Release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${{ github.ref_name }}"
          cp mobile/build/outputs/apk/debug/mobile-debug.apk "PixelGallery-Mobile-${TAG_NAME}.apk"
          cp wear/build/outputs/apk/debug/wear-debug.apk "PixelGallery-Wear-${TAG_NAME}.apk"

      - name: Create GitHub Release with APKs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PixelGallery ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            PixelGallery-Mobile-${{ github.ref_name }}.apk
            PixelGallery-Wear-${{ github.ref_name }}.apk
