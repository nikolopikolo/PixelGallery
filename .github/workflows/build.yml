name: Build PixelGallery

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APKs (Mobile & Wear)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload PixelGallery Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelGallery-Mobile-debug
          path: mobile/build/outputs/apk/debug/*.apk

      - name: Upload PixelGallery Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelGallery-Wear-debug
          path: wear/build/outputs/apk/debug/*.apk
